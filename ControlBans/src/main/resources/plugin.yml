    description: Bypass global chat lock and slowmode.
    default: op
  controlbans.bypass.spam:
    description: Bypass anti-spam checks.
    default: op
  controlbans.bypass.caps:
    description: Bypass caps normalization.
    default: op
  controlbans.bypass.alts:
