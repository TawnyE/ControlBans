#
#  ControlBans Configuration
#  Advanced punishment and moderation system for Minecraft networks.
#  Version: 5.6
# ==============================================================================

# ------------------------------------------------------------------------------
# GENERAL SETTINGS
# ------------------------------------------------------------------------------

# Language for all plugin messages.
# Files are located in the /locales/ folder.
# Available: en, de, es, fr, it, ja, nl, pt, ru, tr
language: "en"

# ------------------------------------------------------------------------------
# STORAGE SETTINGS
# ------------------------------------------------------------------------------
database:
  # Database Backend
  # Options: sqlite, h2, mysql, mariadb, postgresql, mongodb
  type: sqlite

  # SQL Connection Details (MySQL, MariaDB, PostgreSQL)
  host: localhost
  port: 3306
  name: controlbans
  username: root
  password: password

  # File Paths (SQLite / H2)
  sqlite-file: punishments.db
  h2-file: punishments

  # MongoDB Settings (Only if type is 'mongodb')
  mongodb:
    connection-string: "mongodb://localhost:27017"
    database: controlbans

  # Advanced Connection Pool Settings (HikariCP)
  pool:
    maximum-pool-size: 10
    minimum-idle: 5
    connection-timeout: 30000
    idle-timeout: 300000
    max-lifetime: 1800000

  janitor:
    ban-retention-days: 30
    kick-retention-days: 90
    warning-retention-days: 90
    report-retention-days: 60

# ------------------------------------------------------------------------------
# REDIS CACHE / SYNC
# ------------------------------------------------------------------------------
redis:
  enabled: false
  host: localhost
  port: 6379
  password: ""
  pubsub: true
  cache-ttl: 300

# ------------------------------------------------------------------------------
# PUNISHMENT SETTINGS
# ------------------------------------------------------------------------------
punishments:
  default-reasons:
    ban: "Unspecified"
    mute: "Unspecified"
    warn: "Unspecified"
    kick: "Disconnected"

  max-duration:
    tempban: 2592000
    tempmute: 604800

  broadcast:
    enabled: true
    console: true
    players: true
    silent-by-default: false

# ------------------------------------------------------------------------------
# STAFF ALERT SYSTEM
# ------------------------------------------------------------------------------
# Sends detailed alerts to all online staff with 'controlbans.alerts.receive'
# whenever a punishment is issued. Unlike broadcasts, staff alerts are ALWAYS
# sent regardless of silent mode, so staff are always informed.
staff-alerts:
  enabled: true
  sound:
    enabled: true
    type: "BLOCK_NOTE_BLOCK_PLING"
    volume: 0.7
    pitch: 1.5

# ------------------------------------------------------------------------------
# ALT ACCOUNT DETECTION & PUNISHMENT
# ------------------------------------------------------------------------------
alts-punish:
  enabled: false
  apply-to:
    bans: true
    tempbans: false
    mutes: false

  safety:
    min-confidence: 0.8
    max-alts: 5
    cooldown: 300
    # INTEGRITY FIX: Max accounts on one IP before it's ignored as a Public IP.
    # Prevents "148 alts" bugs on VPNs or public networks.
    ip-account-limit: 15

  log-alt-punishments: true
  notify-staff: true

# ------------------------------------------------------------------------------
# INTEGRATIONS
# ------------------------------------------------------------------------------
integrations:
  # DiscordSRV - Send embed notifications to Discord channels.
  discord:
    enabled: false
    messages:
      ban:
        enabled: true
        channel: "ban-logs"
        color: "#DC2626"
        title: "🔨 Permanent Ban Issued"
        description: "**{player}** has been permanently banned."
        fields:
          - { name: "👤 Player", value: "`{player}`", inline: true }
          - { name: "🛡️ Staff", value: "`{staff}`", inline: true }
          - { name: "📝 Reason", value: "```{reason}```", inline: false }
        footer: "ID: {id}"
      tempban:
        enabled: true
        channel: "ban-logs"
        color: "#F59E0B"
        title: "⏳ Temporary Ban Issued"
        description: "**{player}** has been banned for {duration}."
        fields:
          - { name: "👤 Player", value: "`{player}`", inline: true }
          - { name: "🛡️ Staff", value: "`{staff}`", inline: true }
          - { name: "⏱️ Duration", value: "`{duration}`", inline: true }
          - { name: "📝 Reason", value: "```{reason}```", inline: false }
        footer: "ID: {id}"
      ipban:
        enabled: true
        channel: "ban-logs"
        color: "#7F1D1D"
        title: "🚫 IP Ban Issued"
        description: "**{player}** (or their IP) has been banned."
        fields:
          - { name: "👤 Player", value: "`{player}`", inline: true }
          - { name: "🛡️ Staff", value: "`{staff}`", inline: true }
          - { name: "📝 Reason", value: "```{reason}```", inline: false }
        footer: "ID: {id}"
      mute:
        enabled: true
        channel: "mute-logs"
        color: "#3B82F6"
        title: "🔇 Mute Issued"
        description: "**{player}** has been permanently muted."
        fields:
          - { name: "👤 Player", value: "`{player}`", inline: true }
          - { name: "🛡️ Staff", value: "`{staff}`", inline: true }
          - { name: "📝 Reason", value: "```{reason}```", inline: false }
        footer: "ID: {id}"
      tempmute:
        enabled: true
        channel: "mute-logs"
        color: "#06B6D4"
        title: "🤐 Temporary Mute Issued"
        description: "**{player}** has been muted for {duration}."
        fields:
          - { name: "👤 Player", value: "`{player}`", inline: true }
          - { name: "🛡️ Staff", value: "`{staff}`", inline: true }
          - { name: "⏱️ Duration", value: "`{duration}`", inline: true }
          - { name: "📝 Reason", value: "```{reason}```", inline: false }
        footer: "ID: {id}"
      voicemute:
        enabled: true
        channel: "mute-logs"
        color: "#8B5CF6"
        title: "🎙️ Voice Mute Issued"
        description: "**{player}** has been muted in voice chat."
        fields:
          - { name: "👤 Player", value: "`{player}`", inline: true }
          - { name: "🛡️ Staff", value: "`{staff}`", inline: true }
          - { name: "📝 Reason", value: "```{reason}```", inline: false }
        footer: "ID: {id}"
      kick:
        enabled: true
        channel: "kick-logs"
        color: "#EC4899"
        title: "👢 Player Kicked"
        description: "**{player}** was kicked from the server."
        fields:
          - { name: "👤 Player", value: "`{player}`", inline: true }
          - { name: "🛡️ Staff", value: "`{staff}`", inline: true }
          - { name: "📝 Reason", value: "```{reason}```", inline: false }
        footer: "ID: {id}"
      warn:
        enabled: true
        channel: "warn-logs"
        color: "#EAB308"
        title: "⚠️ Warning Issued"
        description: "**{player}** has been warned."
        fields:
          - { name: "👤 Player", value: "`{player}`", inline: true }
          - { name: "🛡️ Staff", value: "`{staff}`", inline: true }
          - { name: "📝 Reason", value: "```{reason}```", inline: false }
        footer: "ID: {id}"
      unban:
        enabled: true
        channel: "ban-logs"
        color: "#22C55E"
        title: "🔓 Player Unbanned"
        description: "**{player}** has been unbanned."
        fields:
          - { name: "👤 Player", value: "`{player}`", inline: true }
          - { name: "🛡️ Staff", value: "`{staff}`", inline: true }
      report:
        enabled: true
        channel: "report-logs"
        color: "#EAB308"
        title: "🚨 Player Report"
        description: "**{target}** has been reported."
        fields:
          - { name: "👤 Reporter", value: "`{reporter}`", inline: true }
          - { name: "🎯 Target", value: "`{target}`", inline: true }
          - { name: "📝 Reason", value: "```{reason}```", inline: false }

  # Geyser / Floodgate (Bedrock Support)
  geyser:
    enabled: true
    bedrock-prefix: "."

  # MCBlacklist (Global Ban List)
  mcblacklist:
    enabled: false
    firebase-url: "https://mcblacklistdb-default-rtdb.firebaseio.com/players.json"
    check-interval: 60
    reason: "Player found on MCBlacklist database"

  # Simple Voice Chat
  voicechat:
    enabled: true

# ------------------------------------------------------------------------------
# CACHE & PERFORMANCE (Caffeine Powered)
# ------------------------------------------------------------------------------
cache:
  enabled: true
  ttl:
    player-lookup: 300
    punishment-check: 60
    alt-lookup: 600
    offline-suggestions: 30
  max-size: 10000

performance:
  async-database: true
  validate-connections: true
  query-timeout: 30
  debug-logging: false

# ------------------------------------------------------------------------------
# UI FEEDBACK
# ------------------------------------------------------------------------------
bossbar:
  voice-mute:
    color: RED
    style: PROGRESS

# ------------------------------------------------------------------------------
# APPEALS SYSTEM
# ------------------------------------------------------------------------------
appeals:
  enabled: true
  cooldown-hours: 24
  max-submissions: 3
  window-days: 7

# ------------------------------------------------------------------------------
# ESCALATION SYSTEM
# ------------------------------------------------------------------------------
escalation:
  enabled: false
  filter-by-reason: true
  history-limit: 100
  window-days: 90
  include:
    bans: true
    tempbans: true
    ipbans: true
  aliases:
    Hacking:
      - cheat
      - cheating
      - hacked client
      - killaura
      - reach
      - scaffold
    Advertising:
      - ad
      - ads
      - external links
      - spam links
  levels:
    default:
      1: 1d
      2: 7d
      3: 30d
      4: permanent
    "Hacking":
      1: 7d
      2: 30d
      3: permanent
    "Advertising":
      1: 12h
      2: 3d
      3: 14d
      4: permanent

# ------------------------------------------------------------------------------
# VOID JAIL
# ------------------------------------------------------------------------------
void-jail:
  location:
    world: "world"
    x: 0.5
    y: -1000.0
    z: 0.5
  allowed-commands:
    - "msg"
    - "r"
    - "tell"
    - "helpop"
    - "appeal"

# ------------------------------------------------------------------------------
# IMPORT SETTINGS
# ------------------------------------------------------------------------------
import:
  sources:
    litebans:
      type: sqlite
      sqlite-file: "plugins/LiteBans/litebans.sqlite"
      host: localhost
      port: 3306
      database: litebans
      username: root
      password: "password"
    advancedban:
      type: mysql
      host: localhost
      port: 3306
      database: advancedban
      username: root
      password: "password"

# ------------------------------------------------------------------------------
# TIME FORMATTING
# ------------------------------------------------------------------------------
time-format:
  date-format: "yyyy-MM-dd"
  timezone: "UTC"

# ------------------------------------------------------------------------------
# REPORT SYSTEM
# ------------------------------------------------------------------------------
report:
  enabled: true
  cooldown-seconds: 60
  notify-staff-permission: "controlbans.alerts.receive"

# ------------------------------------------------------------------------------
# PLAYER NOTES
# ------------------------------------------------------------------------------
notes:
  enabled: true
  max-notes-per-player: 50

# ------------------------------------------------------------------------------
# PUNISHMENT TEMPLATES (Auto-Escalation)
# ------------------------------------------------------------------------------
# Templates define GUI presets AND auto-escalation rules.
# Staff click a template in the GUI OR type /punish <player> #TemplateKey
# and the system applies the right punishment level based on offense count.
#
# ── HOW TO USE ──
#   1. Staff runs /punish <player>
#   2. GUI opens with 3 pages: Bans (red), Mutes (gold), Warns (warm)
#   3. Staff clicks a template → punishment is applied automatically
#   4. Shortcut: /punish <player> #templateKey extra-notes-here
#
# ── HOW ESCALATION WORKS ──
#   Each template has numbered levels (1, 2, 3...). The system counts
#   how many times this player has received this SAME template before.
#   Level 1 = first offense, Level 2 = second offense, etc.
#   If the player has no prior record, Level 1 is used.
#
# ── LEVEL FORMAT ──
#   "<PUNISHMENT_TYPE> [duration]"
#   Types: BAN, TEMPBAN, IPBAN, MUTE, TEMPMUTE, VOICEMUTE, TEMPVOICEMUTE,
#          WARN, KICK, IPMUTE, TEMPIPMUTE
#   Duration (optional): 10m, 1h, 7d, 30d, 365d, permanent
#   Omit duration for permanent punishments (BAN, MUTE, etc.)
#   Example: "TEMPMUTE 7d", "WARN", "BAN", "TEMPBAN 30d"
# ------------------------------------------------------------------------------
templates:
  enabled: true

  # ── KEYWORD MATCHING ──
  # When true: previous offenses are matched by scanning the punishment reason
  #   for keywords listed in the template. Useful if staff type free-form reasons.
  # When false: only explicit #templateKey or display-name matches count as
  #   prior offenses. Staff must use #TemplateKey in reasons for escalation to work.
  # Default: true
  match-by-keywords: true

  rules:

    # ═══════════════════════════════════════════════════════════════════════════
    #  REFERENCE — every field explained:
    #
    #  my-template-key:           # unique ID for #hashtag matching
    #    type: "mute"             # page filter: "ban", "mute", "warn", "kick", "voicemute", "any"
    #    display-name: "#Name"    # GUI label + hashtag for /punish <p> #Name
    #    description: "..."       # GUI tooltip
    #    item: "MATERIAL"         # Bukkit Material for the GUI icon
    #    permission: null         # (optional) required permission node
    #    reason: "..."            # (optional) auto-fills punishment reason.
    #                             #   blank → just "#my-template-key"
    #                             #   set   → "#my-template-key — reason | staff-notes"
    #    keywords:                # (optional) triggers on reason-scan when match-by-keywords: true
    #      - "word"
    #    levels:
    #      window-days: 30        # lookback window for counting repeat offenses
    #      1: "TEMPMUTE 7d"       # level format: "<TYPE> [duration]"
    #      2: "MUTE"              # omit duration for permanent
    #
    #  TYPES:  BAN, TEMPBAN, IPBAN, MUTE, TEMPMUTE, VOICEMUTE, TEMPVOICEMUTE,
    #          WARN, KICK, IPMUTE, TEMPIPMUTE
    #
    # ═══════════════════════════════════════════════════════════════════════════

    # =========================================================================
    #  BANS PAGE — type: "ban" | "any"
    #  These templates show on the red Bans tab.
    # =========================================================================

    # ── Permanent: Player is under 13 (legal/ToS requirement) ──
    underage:
      type: "ban"
      display-name: "<red><bold>#Underage [ADMIN]</bold></red>"
      description: "You must be at least 13 years old"
      item: "RED_CANDLE"
      permission: "controlbans.admin"
      reason: "Underage — player must be at least 13 years old"
      keywords:
        - "underage"
        - "too young"
      levels:
        window-days: 365
        1: "BAN"

    # ── Permanent: Hate speech, racism, discrimination ──
    hate-speech:
      type: "ban"
      display-name: "<red><bold>#Hate-Speech</bold></red>"
      description: "Racism, discrimination, or hate speech — zero tolerance"
      item: "RED_CANDLE"
      reason: "Hate speech — zero tolerance policy"
      keywords:
        - "hate"
        - "racist"
        - "discrimination"
        - "racial"
      levels:
        window-days: 365
        1: "BAN"

    # ── Permanent: Doxing / sharing personal information ──
    doxing:
      type: "ban"
      display-name: "<red><bold>#Doxing</bold></red>"
      description: "Sharing personal information of others"
      item: "RED_CANDLE"
      reason: "Sharing personal information (doxing)"
      keywords:
        - "dox"
        - "doxx"
        - "personal info"
        - "address"
      levels:
        window-days: 365
        1: "BAN"

    # ── Permanent: IRL trading / selling items for real money ──
    irl-trading:
      type: "ban"
      display-name: "<red><bold>#IRL-Trading</bold></red>"
      description: "Selling in-game items or currency for real money"
      item: "RED_CANDLE"
      permission: "controlbans.admin"
      reason: "IRL trading — selling in-game content for real money"
      keywords:
        - "irl trading"
        - "real money"
        - "selling items"
        - "buying items"
        - "paypal"
      levels:
        window-days: 365
        1: "BAN"

    # ── Permanent: Impersonating staff members ──
    impersonating-staff:
      type: "ban"
      display-name: "<red><bold>#Impersonating-Staff</bold></red>"
      description: "Pretending to be a staff member"
      item: "RED_CANDLE"
      permission: "controlbans.admin"
      reason: "Impersonating a staff member"
      keywords:
        - "impersonate"
        - "fake staff"
        - "pretending to be staff"
      levels:
        window-days: 365
        1: "BAN"

    # ── Permanent: Death threats / extreme threats ──
    extreme-threats:
      type: "ban"
      display-name: "<red><bold>#Extreme-Threats</bold></red>"
      description: "Death threats or extreme violent threats"
      item: "RED_CANDLE"
      permission: "controlbans.admin"
      reason: "Extreme threats — violence or death threats"
      keywords:
        - "death threat"
        - "kill you"
        - "ddos"
        - "swat"
      levels:
        window-days: 365
        1: "BAN"

    # ── Escalation: Hacking / cheating type: "any" so it shows on Bans page ──
    hacking:
      type: "any"
      display-name: "#Hacking"
      description: "Using blacklisted clients, mods, or exploits"
      item: "RED_CANDLE"
      reason: "Illegal modifications to the client (cheats)"
      keywords:
        - "hack"
        - "cheat"
        - "exploit"
        - "xray"
        - "fly"
        - "killaura"
      levels:
        window-days: 30
        1: "TEMPBAN 7d"
        2: "BAN"
        3: "IPBAN"

    # ── Escalation: X-Ray resource packs / texture packs ──
    xray:
      type: "any"
      display-name: "#Xray"
      description: "Using X-Ray resource packs or texture packs"
      item: "RED_CANDLE"
      reason: "Use of X-Ray resource packs or texture packs"
      keywords:
        - "xray"
        - "orebfuscator"
        - "wallhack"
      levels:
        window-days: 30
        1: "TEMPBAN 3d"
        2: "TEMPBAN 14d"
        3: "BAN"

    # ── Escalation: Griefing starts with a warn then bans ──
    griefing:
      type: "any"
      display-name: "#Griefing"
      description: "Maliciously destroying or stealing player builds"
      item: "RED_CANDLE"
      reason: "Griefing — malicious destruction of player builds"
      keywords:
        - "grief"
        - "destroy"
        - "tnt"
        - "lava"
        - "fire"
      levels:
        window-days: 14
        1: "WARN"
        2: "TEMPBAN 1d"
        3: "TEMPBAN 7d"
        4: "BAN"

    # ── Escalation: Bug / exploit abuse ──
    bug-abuse:
      type: "any"
      display-name: "#Bug-Abuse"
      description: "Exploiting bugs or glitches for unfair advantage"
      item: "RED_CANDLE"
      permission: "controlbans.mod"
      reason: "Exploiting bugs or glitches for unfair advantage"
      keywords:
        - "bug abuse"
        - "exploit"
        - "dupe"
        - "duplication"
        - "glitch"
      levels:
        window-days: 60
        1: "TEMPBAN 7d"
        2: "TEMPBAN 30d"
        3: "BAN"

    # ── Escalation: Combat logging in PvP ──
    combat-log:
      type: "any"
      display-name: "#Combat-Log"
      description: "Logging out during PvP to avoid death"
      item: "RED_CANDLE"
      reason: "Combat logging — disconnecting during PvP"
      keywords:
        - "combat log"
        - "combatlog"
        - "log out"
        - "pvp log"
      levels:
        window-days: 14
        1: "TEMPBAN 1d"
        2: "TEMPBAN 3d"
        3: "TEMPBAN 7d"

    # ── Escalation: Using alts to evade a punishment ──
    alt-evasion:
      type: "any"
      display-name: "#Alt-Evasion"
      description: "Using alt accounts to evade an active punishment"
      item: "RED_CANDLE"
      permission: "controlbans.mod"
      reason: "Ban evasion — using alternate accounts"
      keywords:
        - "alt evade"
        - "ban evade"
        - "evading"
      levels:
        window-days: 365
        1: "TEMPBAN 7d"
        2: "TEMPBAN 30d"
        3: "BAN"
        4: "IPBAN"

    # =========================================================================
    #  MUTES PAGE — type: "mute" | "tempmute" | "voicemute"
    #  These templates show on the gold Mutes tab.
    # =========================================================================

    # ── Escalation: Swearing / profanity in chat ──
    swearing:
      type: "mute"
      display-name: "#Swearing"
      description: "Inappropriate or abusive language in chat"
      item: "ORANGE_CANDLE"
      reason: "Inappropriate language in chat"
      keywords:
        - "swear"
        - "curse"
        - "profanity"
        - "foul language"
      levels:
        window-days: 7
        1: "TEMPMUTE 1h"
        2: "TEMPMUTE 12h"
        3: "TEMPMUTE 7d"
        4: "MUTE"

    # ── Escalation: Harassment / toxicity ──
    toxicity:
      type: "mute"
      display-name: "#Toxicity"
      description: "Harassment, bullying, or targeted toxicity"
      item: "ORANGE_CANDLE"
      reason: "Harassment or toxicity towards other players"
      keywords:
        - "harass"
        - "bully"
        - "toxic"
        - "target"
      levels:
        window-days: 14
        1: "TEMPMUTE 6h"
        2: "TEMPMUTE 3d"
        3: "TEMPMUTE 14d"
        4: "MUTE"

    # ── Escalation: Spam / flood starts with a WARN ──
    spam:
      type: "mute"
      display-name: "#Spam"
      description: "Flooding chat or repeated messages"
      item: "ORANGE_CANDLE"
      reason: "Spamming in chat"
      keywords:
        - "spam"
        - "flood"
        - "repeat"
        - "copypasta"
      levels:
        window-days: 1
        1: "WARN"
        2: "TEMPMUTE 10m"
        3: "TEMPMUTE 1h"
        4: "TEMPMUTE 12h"
        5: "MUTE"

    # ── Escalation: Advertising external servers / services ──
    advertising:
      type: "mute"
      display-name: "#Advertising"
      description: "Promoting external servers, Discord, or services"
      item: "ORANGE_CANDLE"
      reason: "Advertising external servers or services"
      keywords:
        - "advertise"
        - "join my server"
        - ".com"
        - ".net"
        - "discord.gg"
        - "vote"
      levels:
        window-days: 7
        1: "TEMPMUTE 6h"
        2: "TEMPMUTE 3d"
        3: "MUTE"
        4: "TEMPBAN 7d"

    # ── Escalation: Bypassing chat filter ──
    bypass-filter:
      type: "mute"
      display-name: "#Bypass-Filter"
      description: "Bypassing the chat filter (symbols, spacing, unicode)"
      item: "ORANGE_CANDLE"
      reason: "Bypassing the chat filter"
      keywords:
        - "bypass"
        - "filter bypass"
        - "bypass filter"
      levels:
        window-days: 3
        1: "TEMPMUTE 30m"
        2: "TEMPMUTE 6h"
        3: "TEMPMUTE 2d"
        4: "MUTE"

    # ── Escalation: Excessive caps lock ──
    excessive-caps:
      type: "mute"
      display-name: "#Excessive-Caps"
      description: "Writing in all caps excessively"
      item: "ORANGE_CANDLE"
      reason: "Excessive use of capital letters in chat"
      keywords:
        - "caps"
        - "all caps"
        - "shouting"
      levels:
        window-days: 1
        1: "WARN"
        2: "TEMPMUTE 10m"
        3: "TEMPMUTE 1h"

    # ── Escalation: NSFW / inappropriate content ──
    nsfw:
      type: "mute"
      display-name: "#NSFW"
      description: "Sharing NSFW or sexually explicit content"
      item: "ORANGE_CANDLE"
      reason: "NSFW or sexually explicit content in chat"
