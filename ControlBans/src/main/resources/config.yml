#
#  ControlBans Configuration
#  Advanced punishment and moderation system for Minecraft networks.
#  Version: 6.3-hf1
# ==============================================================================

# ------------------------------------------------------------------------------
# GENERAL SETTINGS
# ------------------------------------------------------------------------------

# Language for all plugin messages.
# Files are located in the /locales/ folder.
# English (en) is the only language bundled with the plugin; any other value
# falls back to English. Community translations are welcome via the GitHub
# repo — drop a <code>.yml into /locales/ to use one.
language: "en"

# ------------------------------------------------------------------------------
# STORAGE SETTINGS
# ------------------------------------------------------------------------------
database:
  # Database Backend
  # Options: sqlite, mysql
  # - sqlite: Embedded file-based database. Ideal for single-server setups.
  #           No external server required. Default for new installations.
  # - mysql:  External MySQL/MariaDB server. Use this for multi-server networks.
  type: sqlite

  # SQLite (Embedded) Database Settings (Only if type is 'sqlite')
  # The database file is stored in the plugin data folder unless an absolute path is given.
  sqlite:
    file: "controlbans.db"

  # MySQL Connection Details (Only if type is 'mysql')
  host: localhost
  port: 3306
  name: controlbans
  username: root
  password: password

  # Advanced Connection Pool Settings (HikariCP)
  # Note: SQLite ignores most of these (uses a single connection).
  pool:
    maximum-pool-size: 10
    minimum-idle: 5
    connection-timeout: 30000
    idle-timeout: 300000
    max-lifetime: 1800000

  janitor:
    ban-retention-days: 30
    kick-retention-days: 90
    warning-retention-days: 90
    report-retention-days: 60

# ------------------------------------------------------------------------------
# PUNISHMENT SETTINGS
# ------------------------------------------------------------------------------
punishments:
  default-reasons:
    ban: "Unspecified"
    mute: "Unspecified"
    warn: "Unspecified"
    kick: "Disconnected"

  mutes:
    block-signs: true
    sign-replacement-text: "[MUTED]"
    blocked-commands:
      - "msg"
      - "tell"
      - "w"
      - "whisper"
      - "me"
      - "reply"
      - "r"

  max-duration:
    tempban: 2592000
    tempmute: 604800

  broadcast:
    enabled: true
    console: true
    players: true
    silent-by-default: false

# ------------------------------------------------------------------------------
# STAFF ALERT SYSTEM
# ------------------------------------------------------------------------------
# Sends detailed alerts to all online staff with 'controlbans.alerts.receive'
# whenever a punishment is issued. Unlike broadcasts, staff alerts are ALWAYS
# sent regardless of silent mode, so staff are always informed.
staff-alerts:
  enabled: true
  sound:
    enabled: true
    type: "BLOCK_NOTE_BLOCK_PLING"
    volume: 0.7
    pitch: 1.5

# ------------------------------------------------------------------------------
# ALT ACCOUNT DETECTION & PUNISHMENT
# ------------------------------------------------------------------------------
alts-punish:
  enabled: false
  apply-to:
    bans: true
    tempbans: false
    mutes: false

  safety:
    min-confidence: 0.8
    max-alts: 5
    cooldown: 300
    # INTEGRITY FIX: Max accounts on one IP before it's ignored as a Public IP.
    # Prevents "148 alts" bugs on VPNs or public networks.
    ip-account-limit: 15

  join-alert:
    # Alert staff when a player joins while sharing an IP with banned accounts.
    enabled: true
    # Max banned alt names shown in the alert before shortening to "+N more".
    max-names: 5

  log-alt-punishments: true
  notify-staff: true

  bypass:
    enabled: true
    permission: "controlbans.bypass.alts"

# ------------------------------------------------------------------------------
# INTEGRATIONS
# ------------------------------------------------------------------------------
integrations:
  # Discord Webhook or DiscordSRV Integration
  discord:
    enabled: false
    webhook-url: ""
    messages:
      ban:
        enabled: true
        channel: "ban-logs"
        color: "#DC2626"
        title: "🔨 Permanent Ban Issued"
        description: "**{player}** has been permanently banned."
        fields:
          - { name: "👤 Player", value: "{player}", inline: true }
          - { name: "🛡️ Staff", value: "{staff}", inline: true }
          - { name: "📝 Reason", value: "```{reason}```", inline: false }
        footer: "ID: {id}"
      tempban:
        enabled: true
        channel: "ban-logs"
        color: "#F59E0B"
        title: "⏳ Temporary Ban Issued"
        description: "**{player}** has been banned for {duration}."
        fields:
          - { name: "👤 Player", value: "{player}", inline: true }
          - { name: "🛡️ Staff", value: "{staff}", inline: true }
          - { name: "⏱️ Duration", value: "{duration}", inline: true }
          - { name: "📝 Reason", value: "```{reason}```", inline: false }
        footer: "ID: {id}"
      ipban:
        enabled: true
        channel: "ban-logs"
        color: "#7F1D1D"
        title: "🚫 IP Ban Issued"
        description: "**{player}** (or their IP) has been banned."
        fields:
          - { name: "👤 Player", value: "{player}", inline: true }
          - { name: "🛡️ Staff", value: "{staff}", inline: true }
          - { name: "📝 Reason", value: "```{reason}```", inline: false }
        footer: "ID: {id}"
      mute:
        enabled: true
        channel: "mute-logs"
        color: "#3B82F6"
        title: "🔇 Mute Issued"
        description: "**{player}** has been permanently muted."
        fields:
          - { name: "👤 Player", value: "{player}", inline: true }
          - { name: "🛡️ Staff", value: "{staff}", inline: true }
          - { name: "📝 Reason", value: "```{reason}```", inline: false }
        footer: "ID: {id}"
      tempmute:
        enabled: true
        channel: "mute-logs"
        color: "#06B6D4"
        title: "🤐 Temporary Mute Issued"
        description: "**{player}** has been muted for {duration}."
        fields:
          - { name: "👤 Player", value: "{player}", inline: true }
          - { name: "🛡️ Staff", value: "{staff}", inline: true }
          - { name: "⏱️ Duration", value: "{duration}", inline: true }
          - { name: "📝 Reason", value: "```{reason}```", inline: false }
        footer: "ID: {id}"
      voicemute:
        enabled: true
        channel: "mute-logs"
        color: "#8B5CF6"
        title: "🎙️ Voice Mute Issued"
        description: "**{player}** has been muted in voice chat."
        fields:
          - { name: "👤 Player", value: "{player}", inline: true }
          - { name: "🛡️ Staff", value: "{staff}", inline: true }
          - { name: "📝 Reason", value: "```{reason}```", inline: false }
        footer: "ID: {id}"
      kick:
        enabled: true
        channel: "kick-logs"
        color: "#EC4899"
        title: "👢 Player Kicked"
        description: "**{player}** was kicked from the server."
        fields:
          - { name: "👤 Player", value: "{player}", inline: true }
          - { name: "🛡️ Staff", value: "{staff}", inline: true }
          - { name: "📝 Reason", value: "```{reason}```", inline: false }
        footer: "ID: {id}"
      warn:
        enabled: true
        channel: "warn-logs"
        color: "#EAB308"
        title: "⚠️ Warning Issued"
        description: "**{player}** has been warned."
        fields:
          - { name: "👤 Player", value: "{player}", inline: true }
          - { name: "🛡️ Staff", value: "{staff}", inline: true }
          - { name: "📝 Reason", value: "```{reason}```", inline: false }
        footer: "ID: {id}"
      unban:
        enabled: true
        channel: "ban-logs"
        color: "#22C55E"
        title: "🔓 Player Unbanned"
        description: "**{player}** has been unbanned."
        fields:
          - { name: "👤 Player", value: "{player}", inline: true }
          - { name: "🛡️ Staff", value: "{staff}", inline: true }
      report:
        enabled: true
        channel: "report-logs"
        color: "#EAB308"
        title: "🚨 Player Report"
        description: "**{target}** has been reported."
        fields:
          - { name: "👤 Reporter", value: "{reporter}", inline: true }
          - { name: "🎯 Target", value: "{target}", inline: true }
          - { name: "📝 Reason", value: "```{reason}```", inline: false }

  # Geyser / Floodgate (Bedrock Support)
  geyser:
    enabled: true
    bedrock-prefix: "."

  # Simple Voice Chat
  voicechat:
    enabled: true

# ------------------------------------------------------------------------------
# STEALTH MODE (IP Obfuscation & Undercover Staff Operations)
# ------------------------------------------------------------------------------
# When enabled, stealth mode omits real IP addresses from punishment logs
# and alt-account detection, substituting a dummy IP instead. This is
# useful for undercover staff operations or privacy-focused moderation.
#
# Staff with 'controlbans.stealth' permission can use stealth mode.
# Use /punish -stealth <player> or set the flag in the GUI.
stealth-mode:
  enabled: false
  # Dummy IP to substitute for real player IPs when stealth mode is active
  dummy-ip: "0.0.0.0"
  # Exclude stealth-marked accounts from IP-based alt linking
  bypass-alt-detection: true
  # Suppress staff alerts for alt joins when a stealth player logs in
  suppress-alt-alerts: true

freeze:
  # Shown in the freeze message (<discord> placeholder). Change to your invite.
  discord: "discord.gg/yourserver"

# ------------------------------------------------------------------------------
# CACHE & PERFORMANCE (Caffeine Powered)
# ------------------------------------------------------------------------------
cache:
  enabled: true
  ttl:
    player-lookup: 300
    punishment-check: 60
    alt-lookup: 600
    offline-suggestions: 30
  max-size: 10000

performance:
  async-database: true
  validate-connections: true
  query-timeout: 30
  debug-logging: false

# ------------------------------------------------------------------------------
# UI FEEDBACK
# ------------------------------------------------------------------------------
bossbar:
  voice-mute:
    color: RED
    style: PROGRESS

# ------------------------------------------------------------------------------
# APPEALS SYSTEM
# ------------------------------------------------------------------------------
appeals:
  enabled: true
  cooldown-hours: 24
  max-submissions: 3
  window-days: 7
  # Shown on ban screens — fully customizable (user-first). Empty = hidden.
  appeal-link: "discord.gg/yourserver"


# ------------------------------------------------------------------------------
# IMPORT SETTINGS
# ------------------------------------------------------------------------------
import:
  sources:
    litebans:
      type: mysql
      host: localhost
      port: 3306
      database: litebans
      username: root
      password: "password"
      # SQLite file path (only if type is 'sqlite'). Also accepts 'sqlite-file' as alias.
      file: "plugins/LiteBans/litebans.db"
    advancedban:
      type: mysql
      host: localhost
      port: 3306
      database: advancedban
      username: root
      password: "password"
      file: "plugins/AdvancedBan/data.db"

# ------------------------------------------------------------------------------
# TIME FORMATTING
# ------------------------------------------------------------------------------
time-format:
  date-format: "yyyy-MM-dd HH:mm:ss"
  timezone: "UTC"

# ------------------------------------------------------------------------------
# REPORT SYSTEM
# ------------------------------------------------------------------------------
report:
  enabled: true
  cooldown-seconds: 60
  duplicate-window-seconds: 300
  notify-staff-permission: "controlbans.alerts.receive"
  allow-custom-reason: true
  teleport-to-players: true
  # Report categories shown in the reporting GUI. Add/remove freely.
  # id: internal key used as the stored category. icon: any Bukkit Material name.
  # name/lore support MiniMessage. Placeholders in lore: none needed.
  categories:
    - id: hacking
      icon: DIAMOND_SWORD
      name: "<red>Cheating / Hacking</red>"
      lore:
        - "<gray>Killaura, fly, x-ray, speed..."
    - id: chat
      icon: PAPER
      name: "<yellow>Chat Offense</yellow>"
      lore:
        - "<gray>Slurs, harassment, advertising..."
    - id: griefing
      icon: TNT
      name: "<gold>Griefing</gold>"
      lore:
        - "<gray>Destroyed builds, stolen items..."
    - id: other
      icon: BOOK
      name: "<aqua>Other</aqua>"
      lore:
        - "<gray>Something else — you'll be asked to describe it."

# ------------------------------------------------------------------------------
# PLAYER NOTES
# ------------------------------------------------------------------------------
notes:
  enabled: true
  max-notes-per-player: 50

# ------------------------------------------------------------------------------
# PUNISH UI / ESCALATION PRESETS
# ------------------------------------------------------------------------------
punish:
  # Which UI /punish uses:
  #   auto   = dialogs on Paper 1.21.6+ (with automatic inventory fallback),
  #   dialog = force dialogs (inventory fallback still applies on failure),
  #   gui    = always the inventory GUI
  interface: auto

  # Master switch for escalation presets (escalation.yml). When false, /punish
  # still opens the category/preset UI but no presets are available and
  # /punish <player> <preset> is rejected.
  escalation-enabled: true
